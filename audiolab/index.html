<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RMD AudioLab mudou de endereço</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#070b0e;color:#e8f3f6;font-family:system-ui,Segoe UI,Roboto,sans-serif;text-align:center;padding:1.5rem}a{display:inline-block;margin-top:1rem;background:#49c7ef;color:#061014;font-weight:800;padding:1rem 1.4rem;border-radius:14px;text-decoration:none;font-size:1.1rem}</style>
</head>
<body>
<div>
  <h1>🎧 O RMD AudioLab mudou de endereço</h1>
  <p>Agora ele tem o endereço próprio, separado dos outros sistemas.</p>
  <a id="ir" href="https://rmd-audiolab.github.io/">Abrir o RMD AudioLab</a>
  <p style="opacity:.7;font-size:.9rem;margin-top:1rem">Depois, toque em “Instalar o ícone” no novo endereço.</p>
</div>
<script>
// 20/11/2026: o treino em casa saiu de rinaldomiranda-netizen.github.io/audiolab (junto do RMD Ponto) e foi para endereço próprio.
// Leva o código do aluno (?c=...) junto e apaga a cópia antiga guardada no celular.
(function () {
  var novo = "https://rmd-audiolab.github.io/" + (location.search || "");
  document.getElementById("ir").href = novo;
  try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.indexOf("/audiolab/") >= 0) r.unregister(); }); }); } catch (e) {}
  try { if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf("rmd-audiolab-casa-") === 0) caches.delete(k); }); }); } catch (e) {}
  setTimeout(function () { location.replace(novo); }, 800);
})();
</script>
</body>
</html>
